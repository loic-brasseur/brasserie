<style>
  :root{
    --bg:#FBF5EC;--bg2:#F4ECDC;--card:#FFFDF7;--ink:#1A1612;--ink-soft:#7A6F5C;
    --copper:#A8541B;--gold:#CF982B;--green:#4F6B2F;--red:#B3261E;
    --line:rgba(26,22,18,.12);--line-strong:rgba(26,22,18,.24);
    --shadow:0 1px 2px rgba(26,22,18,.05),0 8px 24px rgba(26,22,18,.09);
    --serif:'Fraunces',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);line-height:1.45;min-height:100vh;background:radial-gradient(ellipse at top,#FBF5EC 0%,#F4ECDC 100%);background-attachment:fixed;-webkit-font-smoothing:antialiased;
    padding:max(1.4rem,env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) 5rem max(1rem,env(safe-area-inset-left))}
  .wrap{max-width:1280px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,5vw,2.4rem);margin:0;letter-spacing:-.02em;line-height:1}
  .sub{font-family:var(--serif);font-style:italic;color:var(--ink-soft);margin-top:.35rem}
  .tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg button{all:unset;cursor:pointer;padding:.45rem .7rem;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
  .seg button.on{background:var(--ink);color:#FBF5EC}
  .btn{all:unset;cursor:pointer;padding:.48rem .8rem;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);font-size:.82rem;font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:1rem;overflow:hidden}
  .card-h{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;flex-wrap:wrap;padding:.85rem 1.1rem;border-bottom:1px solid var(--line)}
  .card-h h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0}
  .card-h .meta{font-size:.78rem;color:var(--ink-soft)}
  .card-b{padding:.9rem 1.1rem}
  /* frise */
  .tl{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .grid{position:relative;min-width:100%}
  .row{display:flex;border-bottom:1px solid var(--line);position:relative}
  .row:last-child{border-bottom:0}
  .lab{position:sticky;left:0;z-index:3;flex:0 0 118px;background:var(--card);padding:.55rem .7rem;border-right:1px solid var(--line);font-size:.86rem}
  .lab b{display:block;font-family:var(--serif);font-weight:600;font-size:.98rem}
  .lab small{color:var(--ink-soft);font-size:.72rem}
  .lane{position:relative;flex:1;height:64px}
  .hdr .lane{height:42px}
  .wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
  .wk.alt{background:rgba(26,22,18,.025)}
  .wkl{position:absolute;top:4px;font-size:.7rem;font-weight:700;color:var(--ink-soft);white-space:nowrap;padding-left:4px}
  .wkl small{display:block;font-weight:500}
  .today{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2;pointer-events:none}
  .today.lbl::after{content:'aujourd’hui';position:absolute;bottom:2px;left:4px;font-size:.62rem;font-weight:700;color:var(--red);white-space:nowrap}
  .blk{position:absolute;top:9px;height:46px;border-radius:9px;padding:4px 7px;font-size:.74rem;line-height:1.2;overflow:hidden;cursor:pointer;z-index:1;
    border:1.5px solid rgba(26,22,18,.18);box-shadow:0 1px 3px rgba(26,22,18,.12);white-space:nowrap;text-overflow:ellipsis}
  .blk b{display:block;font-size:.78rem;overflow:hidden;text-overflow:ellipsis}
  .blk.plan{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 6px,transparent 6px 12px);border-style:dashed}
  .blk.past{opacity:.45}
  .blk.late{box-shadow:inset 0 0 0 2px #CF982B}
  .blk.conf{border:2px solid var(--red)!important;box-shadow:0 0 0 2px rgba(179,38,30,.18)}
  .legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft);padding:.6rem 1.1rem;border-top:1px solid var(--line)}
  .legend i{display:inline-block;width:22px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1.5px solid rgba(26,22,18,.25);background:#E8D9BE}
  .legend i.p{border-style:dashed;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 4px,transparent 4px 8px)}
  .legend i.h{opacity:.45}.legend i.c{border:2px solid var(--red)}.legend i.l{box-shadow:inset 0 0 0 2px #CF982B}
  /* alertes + disponibilités */
  .alerts{display:flex;flex-direction:column;gap:.45rem}
  .al{padding:.6rem .8rem;border-radius:11px;font-size:.86rem;border:1px solid}
  .al.bad{background:rgba(179,38,30,.07);border-color:rgba(179,38,30,.3);color:#8C1D16}
  .al.warn{background:rgba(207,152,43,.1);border-color:rgba(207,152,43,.4)}
  .al.ok{background:rgba(79,107,47,.08);border-color:rgba(79,107,47,.3);color:#3d5424}
  table.t{width:100%;border-collapse:collapse;font-size:.85rem}
  table.t th{text-align:left;font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);padding:.4rem .5rem;border-bottom:1px solid var(--line-strong)}
  table.t td{padding:.5rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
  .pill{display:inline-block;font-size:.7rem;font-weight:700;padding:.12rem .45rem;border-radius:999px}
  .pill.free{background:rgba(79,107,47,.14);color:#3d5424}.pill.busy{background:rgba(168,84,27,.13);color:var(--copper)}.pill.late{background:rgba(207,152,43,.2);color:#7a5410}
  .tw{overflow-x:auto}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
  @media(max-width:860px){.two{grid-template-columns:1fr}.lab{flex-basis:92px}}
  /* fenêtre détail */
  .ov{position:fixed;inset:0;background:rgba(26,22,18,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
  .ov.show{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:440px;width:100%;padding:1.1rem 1.2rem;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal h3{font-family:var(--serif);margin:0 0 .4rem;font-size:1.25rem}
  .modal dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;margin:.6rem 0;font-size:.88rem}.modal dt{color:var(--ink-soft)}.modal dd{margin:0;font-weight:600}
  .modal .acts{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.8rem}
  .empty{padding:1.4rem;text-align:center;color:var(--ink-soft)}
  @media print{@page{size:A4 landscape;margin:10mm}body{background:#fff;padding:0}.tools,#backHome,.ov,#bsync-pill{display:none!important}.card{box-shadow:none;break-inside:avoid}.tl{overflow:visible}}
</style>

<div class="wrap">
  <header>
    <div><h1>Planning des cuves</h1><div class="sub">Automatique : lots en cuve (Suivi des cuves) + brassins prévus (Planning de brassage)</div></div>
    <div class="tools">
      <div class="seg" id="range"><button data-w="8">8 sem.</button><button data-w="12" class="on">12 sem.</button><button data-w="26">6 mois</button></div>
      <button class="btn" onclick="render()">Actualiser</button>
      <button class="btn" onclick="window.print()">PDF</button>
    </div>
  </header>

  <div class="card"><div class="card-h"><h2>Occupation</h2><span class="meta" id="fresh"></span></div>
    <div class="tl"><div class="grid" id="grid"></div></div>
    <div class="legend"><span><i></i>En cuve (Suivi des cuves)</span><span><i class="p"></i>Prévu (Planning de brassage)</span><span><i class="h"></i>Lot terminé</span><span><i class="l"></i>Conditionnement prévu dépassé</span><span><i class="c"></i>Conflit</span></div>
  </div>

  <div class="two">
    <div class="card"><div class="card-h"><h2>À surveiller</h2></div><div class="card-b"><div class="alerts" id="alerts"></div></div></div>
    <div class="card"><div class="card-h"><h2>Disponibilités</h2></div><div class="card-b tw" id="avail"></div></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal"><h3 id="m_t"></h3><div id="m_b"></div><div class="acts" id="m_a"></div></div></div>

<script>
'use strict';
/* ---------- données ---------- */
const DAY=864e5;
const DEFAULT_TANKS=[{id:'c1',name:'Cuve 1',cap:60},{id:'c2',name:'Cuve 2',cap:60},{id:'c3',name:'Cuve 3',cap:60},{id:'c4',name:'Cuve 4',cap:60},{id:'c5',name:'Cuve 5',cap:20},{id:'c6',name:'Cuve 6',cap:16},{id:'c7',name:'Cuve 7',cap:16}];
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v;}catch(e){return d;}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mid=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const parse=s=>s?mid(new Date(String(s).slice(0,10)+'T00:00:00')):null;
const add=(d,n)=>new Date(+d+n*DAY);
const fmt=d=>d?d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
const monday=d=>{const x=mid(d);return add(x,-((x.getDay()+6)%7));};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/DAY-3+((f.getUTCDay()+6)%7))/7);}
function colorFor(name){const n=String(name||'').toLowerCase();
  if(n.includes('framboise'))return '#E9C7DA';if(n.includes('tutti'))return '#F1C9C9';if(n.includes('noël')||n.includes('noel'))return '#D6CBE6';if(n.includes('saison'))return '#F7D3A3';
  if(n.includes('blanche'))return '#C9DDF0';if(n.includes('brune')||n.includes('stout')||n.includes('black'))return '#CDB394';if(n.includes('ambr'))return '#E6C49B';if(n.includes('triple'))return '#EFC4C4';
  if(n.includes('ipa')||n.includes('neipa'))return '#D2E6C9';if(n.includes('blonde')||n.includes('pils')||n.includes('lager'))return '#F6E7B5';
  let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 45% 82%)`;}
const short=n=>String(n||'').replace(/^Bi[eèé]re\s+/i,'').replace(/\s+BIO$/i,'');

function collect(){
  const today=mid(new Date());
  const cv=ld('brasserie_cuves_v1',null);const tanks=(cv&&Array.isArray(cv.tanks)&&cv.tanks.length?cv.tanks:DEFAULT_TANKS);
  const snap=ld('brasserie_brassins_v1',null);
  const B=tanks.map(()=>[]);
  // lots en cuve
  tanks.forEach((t,i)=>{const b=t.batch;if(!b)return;
    const s=parse(b.start)||today;let plannedEnd=parse(b.pack)||parse(b.end)||add(s,21);
    const late=plannedEnd<today;const e=late?add(today,1):add(plannedEnd,1);
    B[i].push({kind:'act',s,e,plannedEnd,late,name:b.recipe||'Brassin',lot:b.lot,vol:b.volume,batch:b,tank:t});});
  // lots terminés (historique)
  (cv&&cv.archive||[]).forEach(a=>{const i=tanks.findIndex(t=>t.id===a.tankId||t.name===a.tankName);if(i<0)return;
    const s=parse(a.start),e=parse(a.closed&&a.closed.date);if(!s||!e)return;B[i].push({kind:'past',s,e:add(e,1),name:a.recipe,lot:a.lot,vol:a.closed&&a.closed.volHL,tank:tanks[i]});});
  // brassins prévus, regroupés par cuve / semaine / bière (ex. 3 brassins de 20 HL = 60 HL)
  const curMon=monday(today),plan={};
  (snap&&snap.brews||[]).forEach(p=>{const s=parse(p.date);if(!s||s<curMon)return;
    (p.cuves||[]).forEach(ci=>{if(ci<0||ci>=tanks.length)return;const k=ci+'|'+p.week+'|'+p.beer;
      const g=plan[k]||(plan[k]={kind:'plan',ci,s,e:add(s,7*(p.occWeeks||3)),name:p.beer,code:p.code,week:p.week,hl:0,n:0,condWeek:p.condWeek,tank:tanks[ci]});
      g.hl+=(p.cuves.length>1?(p.brutHl||0)/p.cuves.length:(p.brutHl||0));g.n++;});});
  Object.values(plan).forEach(g=>{
    // déjà en cuve ? (lot de la même bière démarré cette semaine-là dans cette cuve) → ne pas doubler
    const done=B[g.ci].some(x=>x.kind!=='plan'&&Math.abs(x.s-g.s)<8*DAY&&short(x.name).toLowerCase().split(' ')[0]===short(g.name).toLowerCase().split(' ')[0]);
    if(!done)B[g.ci].push(g);});
  // conflits : un brassin prévu dans une cuve encore occupée
  const conflicts=[];
  B.forEach((L,i)=>{L.filter(x=>x.kind==='plan').forEach(p=>{L.filter(x=>x.kind==='act'&&x.e>p.s).forEach(a=>{p.conf=a.conf=true;
    conflicts.push({tank:tanks[i],plan:p,act:a});});
    L.filter(x=>x.kind==='plan'&&x!==p&&x.s<p.e&&p.s<x.e&&x.s>=p.s).forEach(o=>{if(o.name!==p.name){o.conf=p.conf=true;conflicts.push({tank:tanks[i],plan:o,other:p});}});});});
  return {today,tanks,B,snap,conflicts,unplaced:(snap&&snap.conflicts)||[]};
}

/* ---------- rendu ---------- */
let WEEKS=12;try{WEEKS=+localStorage.getItem('brasserie__planning_cuves_weeks')||12;}catch(e){}
function render(){
  const D=collect(),start=add(monday(D.today),-14),end=add(start,WEEKS*7+14),days=(end-start)/DAY;
  const host=document.querySelector('.tl'),labW=window.innerWidth<860?92:118;
  const dayW=Math.max(window.innerWidth<860?9:7,Math.floor((host.clientWidth-labW-2)/days));
  const W=Math.round(days*dayW),X=d=>Math.round((d-start)/DAY*dayW);
  let weeks='';for(let d=new Date(start),k=0;d<end;d=add(d,7),k++){weeks+=`<div class="wk${k%2?' alt':''}" style="left:${X(d)}px;width:${7*dayW}px"></div>`;}
  let hdr='';for(let d=new Date(start);d<end;d=add(d,7)){hdr+=`<div class="wkl" style="left:${X(d)}px">S${isoWeek(d)}<small>${d.getDate()} ${d.toLocaleDateString('fr-FR',{month:'short'})}</small></div>`;}
  const tx=X(D.today)+Math.round(dayW/2);
  let h=`<div class="row hdr"><div class="lab"><small>Semaine</small></div><div class="lane" style="width:${W}px">${weeks}${hdr}<div class="today lbl" style="left:${tx}px"></div></div></div>`;
  let idx=0;window._blk=[];
  D.tanks.forEach((t,i)=>{
    const L=D.B[i].filter(b=>b.e>start&&b.s<end).sort((a,b)=>a.s-b.s);
    const cur=t.batch;
    h+=`<div class="row"><div class="lab"><b>${esc(t.name)}</b><small>${t.cap} HL · ${cur?'occupée':'libre'}</small></div><div class="lane" style="width:${W}px">${weeks}<div class="today" style="left:${tx}px"></div>`;
    L.forEach(b=>{const x=Math.max(0,X(b.s)),w=Math.max(18,Math.min(W,X(b.e))-x-2);window._blk[idx]=b;
      const cls=b.kind==='plan'?'plan':b.kind==='past'?'past':'';
      const l2=b.kind==='plan'?`S${b.week} · ${Math.round(b.hl)} HL${b.n>1?' ('+b.n+' brassins)':''}`:b.kind==='act'?`${b.lot?'lot '+esc(b.lot)+' · ':''}${b.vol!=null?Math.round(b.vol*10)/10+' HL':''}${b.late?' · cond. dépassé':''}`:`lot ${esc(b.lot||'')}`;
      h+=`<div class="blk ${cls}${b.late?' late':''}${b.conf?' conf':''}" style="left:${x}px;width:${w}px;background-color:${colorFor(b.name)}" onclick="detail(${idx})" title="${esc(short(b.name))}"><b>${esc(short(b.name))}</b>${l2}</div>`;idx++;});
    h+=`</div></div>`;});
  const g=document.getElementById('grid');g.style.width=(W+labW)+'px';g.innerHTML=h;
  host.scrollLeft=Math.max(0,X(add(D.today,-7)));
  document.getElementById('fresh').textContent=D.snap&&D.snap.updatedAt?'Planning de brassage calculé le '+new Date(D.snap.updatedAt).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Ouvre une fois le Planning de brassage pour afficher les brassins prévus';
  renderAlerts(D);renderAvail(D);
}
function renderAlerts(D){
  const a=[];
  D.conflicts.forEach(c=>{if(c.act)a.push(`<div class="al bad"><b>${esc(c.tank.name)}</b> : ${esc(short(c.act.name))}${c.act.lot?' (lot '+esc(c.act.lot)+')':''} est encore en cuve ${c.act.late?'(conditionnement prévu dépassé)':'jusqu’au '+fmt(c.act.plannedEnd)}, alors que <b>${esc(short(c.plan.name))}</b> y est prévu à partir de la S${c.plan.week} (${fmt(c.plan.s)}). Conditionne avant, ou change la cuve dans le Planning de brassage.</div>`);
    else a.push(`<div class="al bad"><b>${esc(c.tank.name)}</b> : ${esc(short(c.plan.name))} et ${esc(short(c.other.name))} se chevauchent.</div>`);});
  D.unplaced.forEach(u=>a.push(`<div class="al bad">S${u.week} : <b>${esc(short(u.beer))}</b> (${u.brut} HL) — aucune cuve disponible dans le Planning de brassage.</div>`));
  D.tanks.forEach((t,i)=>D.B[i].filter(b=>b.kind==='act'&&b.late).forEach(b=>a.push(`<div class="al warn"><b>${esc(t.name)}</b> : conditionnement de ${esc(short(b.name))}${b.lot?' (lot '+esc(b.lot)+')':''} prévu le ${fmt(b.plannedEnd)}, le lot est toujours en cuve.</div>`)));
  D.tanks.forEach(t=>{const b=t.batch;if(b&&!b.pack&&!b.end)a.push(`<div class="al warn"><b>${esc(t.name)}</b> : pas de date de conditionnement pour ${esc(short(b.recipe))} — occupation estimée à 3 semaines. Ajoute-la dans le Suivi des cuves (Modifier).</div>`);});
  document.getElementById('alerts').innerHTML=a.length?a.join(''):'<div class="al ok">Aucun conflit : chaque brassin prévu a une cuve libre.</div>';
}
function renderAvail(D){
  const rows=D.tanks.map((t,i)=>{const L=D.B[i].filter(b=>b.kind!=='past').sort((a,b)=>a.s-b.s);
    const act=L.find(b=>b.kind==='act'),next=L.find(b=>b.kind==='plan');
    const freeFrom=act?(act.late?D.today:add(act.plannedEnd,1)):D.today;
    const st=act?(act.late?`<span class="pill late">en retard</span>`:`<span class="pill busy">occupée</span>`):`<span class="pill free">libre</span>`;
    const now=act?`${esc(short(act.name))}${act.vol!=null?' · '+Math.round(act.vol*10)/10+' HL':''}<br><small style="color:var(--ink-soft)">cond. prévu ${fmt(act.plannedEnd)}</small>`:'—';
    const nx=next?`S${next.week} · ${esc(short(next.name))} · ${Math.round(next.hl)} HL`:'<span style="color:var(--ink-soft)">rien de prévu</span>';
    const gap=next?Math.round((next.s-freeFrom)/DAY):null;
    const win=next?(gap>0?`libre ${gap} j (du ${fmt(freeFrom)} au ${fmt(add(next.s,-1))})`:gap<0?'<span style="color:var(--red);font-weight:700">chevauchement</span>':'enchaînement direct'):`libre dès le ${fmt(freeFrom)}`;
    return `<tr><td><b>${esc(t.name)}</b><br><small style="color:var(--ink-soft)">${t.cap} HL</small></td><td>${st}</td><td>${now}</td><td>${nx}<br><small style="color:var(--ink-soft)">${win}</small></td></tr>`;}).join('');
  document.getElementById('avail').innerHTML=`<table class="t"><thead><tr><th>Cuve</th><th>État</th><th>En cuve</th><th>Prochain brassin</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function detail(i){const b=window._blk[i];if(!b)return;
  const dl=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  document.getElementById('m_t').textContent=short(b.name);
  let body='<dl>'+dl('Cuve',esc(b.tank.name)+' ('+b.tank.cap+' HL)');
  if(b.kind==='act')body+=dl('État',b.late?'en cuve — conditionnement prévu dépassé':'en cuve')+dl('Lot',esc(b.lot))+dl('Volume',b.vol!=null?Math.round(b.vol*10)/10+' HL':'')+dl('Mise en cuve',fmt(b.s))+dl('Conditionnement prévu',fmt(b.plannedEnd));
  else if(b.kind==='plan')body+=dl('Prévu','semaine '+b.week+' — à partir du '+fmt(b.s))+dl('Volume',Math.round(b.hl)+' HL'+(b.n>1?' ('+b.n+' brassins)':''))+dl('Occupation','jusqu’au '+fmt(add(b.e,-1)))+dl('Conditionnement',b.condWeek?'semaine '+b.condWeek:'');
  else body+=dl('Lot',esc(b.lot))+dl('Mise en cuve',fmt(b.s))+dl('Soutiré le',fmt(add(b.e,-1)))+dl('Volume soutiré',b.vol!=null?b.vol+' HL':'');
  body+='</dl>'+(b.conf?'<div class="al bad" style="margin-top:.4rem">En conflit avec un autre lot sur cette cuve.</div>':'');
  document.getElementById('m_b').innerHTML=body;
  document.getElementById('m_a').innerHTML=`<a class="btn" href="${b.kind==='plan'?'planning-brassage.html':'cuves.html'}" style="text-decoration:none;color:inherit">${b.kind==='plan'?'Planning de brassage':'Suivi des cuves'}</a><button class="btn" onclick="document.getElementById('ov').classList.remove('show')">Fermer</button>`;
  document.getElementById('ov').classList.add('show');}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')e.target.classList.remove('show');});
document.querySelectorAll('#range button').forEach(b=>{b.classList.toggle('on',+b.dataset.w===WEEKS);b.onclick=()=>{WEEKS=+b.dataset.w;try{localStorage.setItem('brasserie__planning_cuves_weeks',WEEKS);}catch(e){}
  document.querySelectorAll('#range button').forEach(x=>x.classList.toggle('on',x===b));render();};});
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(render,150);});
window.addEventListener('storage',e=>{if(/cuves|brassins/.test(e.key||''))render();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render();});
render();
</script>
</body>
</html>
